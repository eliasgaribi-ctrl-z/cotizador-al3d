<!doctype html>
<html lang="es">
<meta charset="UTF-8">
<title>Plataforma AL3D</title>
<meta name="robots" content="noindex">
<!-- La plataforma ES la portada del sitio desde el cambio de puerta de entrada: vive en
     index.html y se abre en la raíz. Este archivo no es deuda ni cortesía: es la dirección
     que está escrita en tres sitios que no controlamos —los marcadores, los shortcuts del
     manifiesto ya instalado y, en iPhone, DENTRO del icono de la pantalla de inicio, que
     guarda la URL con la que se agregó y no la que diga el manifiesto de hoy—. Borrarlo
     rompe esos iconos y nadie se entera hasta que alguien lo abre sin señal, delante del
     cliente. Se queda para siempre, y va en APP_FILES para que también reenvíe sin señal.

     El hash se conserva a propósito: #/agenda tiene que seguir llegando a la agenda. Va
     replace() y no href: un reenvío que deja entrada en el historial convierte el gesto de
     atrás en un rebote infinito contra esta misma página. El meta refresh va dentro de
     noscript porque suelto competiría con el script por quién navega primero, y el meta
     PIERDE el hash. -->
<script>location.replace('./' + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0;url=./"></noscript>
<p>La app se mudó a la portada, y ahora abre en el tablero del taller. <a href="./#/hoy">Abrirla</a>.</p>
</html>
